<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九九乘法大挑戰</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

:root {
  --bg: #fff8f0;
  --card: #ffffff;
  --primary: #ff6b35;
  --primary-light: #fff0eb;
  --correct: #00c896;
  --correct-bg: #e6fff8;
  --wrong: #f44336;
  --wrong-bg: #fff0ef;
  --blue: #2196f3;
  --text: #1a1a2e;
  --muted: #9e9e9e;
  --shadow: 0 4px 16px rgba(0,0,0,.09);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', 'Nunito', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; align-items: center; min-height: 100vh; }
.screen.active { display: flex; }

/* ══ START ══ */
#startScreen {
  justify-content: center; gap: 24px; padding: 32px 20px;
  background: linear-gradient(160deg, #fff8f0 0%, #ffeee6 100%);
}
.logo-icon {
  width: 96px; height: 96px;
  background: linear-gradient(135deg, var(--primary), #ff9a5c);
  border-radius: 28px; font-size: 50px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 36px rgba(255,107,53,.4);
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)rotate(-3deg)} 50%{transform:translateY(-10px)rotate(3deg)} }
.app-title {
  font-family: 'Nunito', sans-serif; font-size: clamp(28px,7vw,50px);
  font-weight: 900; color: var(--primary); letter-spacing: -1px;
  text-align: center;
}
.app-sub { font-size: 14px; color: var(--muted); font-weight: 700; text-align: center; }
.badges { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.badge {
  background: var(--card); border-radius: 50px; padding: 9px 20px;
  font-weight: 900; font-size: 14px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 5px;
}
.badge b { font-family: 'Nunito', sans-serif; font-size: 18px; color: var(--primary); }
.btn-start {
  background: linear-gradient(135deg, var(--primary), #ff9a5c);
  color: #fff; border: none; border-radius: 50px;
  padding: 17px 60px; font-size: 19px; font-weight: 900; cursor: pointer;
  box-shadow: 0 8px 28px rgba(255,107,53,.45);
  transition: transform .15s, box-shadow .15s;
  font-family: 'Noto Sans TC', sans-serif;
}
.btn-start:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(255,107,53,.5); }

/* history on start */
.hist-box {
  background: var(--card); border-radius: var(--radius);
  padding: 16px 20px; box-shadow: var(--shadow);
  width: 100%; max-width: 420px;
}
.hist-box-title { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: 1px; margin-bottom: 10px; }
.hist-mini-rows { display: flex; flex-direction: column; gap: 7px; }
.hmr { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.hmr-date { color: var(--muted); font-weight: 600; }
.gpill {
  font-weight: 900; font-size: 12px; padding: 3px 11px;
  border-radius: 20px; font-family: 'Nunito', sans-serif;
}
.gS{background:#e6fff8;color:#00c896} .gA{background:#fff8e1;color:#f9a825}
.gB{background:#fff0eb;color:#ef6c00} .gC{background:#fff0ef;color:#f44336}
.no-rec { font-size: 13px; color: var(--muted); }

/* ══ QUIZ ══ */
#quizScreen { justify-content: flex-start; }

.topbar {
  width: 100%; background: var(--card);
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  padding: 10px 14px; position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px;
}
.prog-wrap { flex: 1; }
.prog-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.prog-bar { height: 8px; background: #eee; border-radius: 8px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #ffca28); border-radius: 8px; transition: width .4s; }
.topbar-ok {
  background: var(--correct-bg); border-radius: 10px; padding: 5px 12px;
  display: flex; flex-direction: column; align-items: center; min-width: 56px;
}
.topbar-ok .tv { font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; color: var(--correct); line-height: 1; }
.topbar-ok .tl { font-size: 10px; font-weight: 700; color: #5fcbaa; }
.timer {
  background: var(--primary-light); border-radius: 10px; padding: 5px 12px;
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px;
  color: var(--primary); min-width: 78px; text-align: center;
  transition: background .3s, color .3s;
}
.timer.warn   { background: #fff8e1; color: #f9a825; }
.timer.danger { background: #fff0ef; color: var(--wrong); animation: tpulse .4s ease-in-out infinite alternate; }
@keyframes tpulse { from{transform:scale(1)} to{transform:scale(1.06)} }

/* question grid */
.q-grid {
  width: 100%; max-width: 1100px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px; padding: 12px;
}
@media(max-width:900px){ .q-grid{ grid-template-columns: repeat(4,1fr); } }
@media(max-width:680px){ .q-grid{ grid-template-columns: repeat(3,1fr); } }
@media(max-width:460px){ .q-grid{ grid-template-columns: repeat(2,1fr); gap:6px; padding:8px; } }

/* question card */
.qc {
  background: var(--card); border-radius: 12px;
  border: 2px solid #f0f0f0; padding: 10px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  transition: border-color .2s, background .2s;
  position: relative;
}
.qc.state-correct { border-color: var(--correct); background: var(--correct-bg); }
.qc.state-wrong   { border-color: var(--wrong);   background: var(--wrong-bg); }
.qc.state-locked  { opacity: .5; pointer-events: none; }
.qc.state-locked::after {
  content: '⏰'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; background: rgba(255,255,255,.7); border-radius: 10px;
}
.qc-num { font-size: 10px; font-weight: 900; color: var(--muted); font-family: 'Nunito', sans-serif; align-self: flex-start; }
.qc-expr {
  font-size: clamp(14px, 2.2vw, 20px);
  font-weight: 900; font-family: 'Nunito', sans-serif; white-space: nowrap;
}

/* input */
.qc-inp {
  width: 100%; max-width: 72px;
  border: 2px solid #e0e0e0; border-radius: 8px;
  text-align: center; font-size: clamp(15px,2.5vw,20px);
  font-weight: 900; font-family: 'Nunito', sans-serif;
  padding: 5px 4px; outline: none; background: transparent; color: var(--text);
  transition: border-color .15s;
  -moz-appearance: textfield;
}
.qc-inp::-webkit-inner-spin-button,
.qc-inp::-webkit-outer-spin-button { -webkit-appearance: none; }
.qc-inp:focus:not(:read-only) { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,.15); }
.qc-inp.inp-correct { border-color: var(--correct); color: var(--correct); background: var(--correct-bg); }
.qc-inp.inp-wrong   { border-color: var(--wrong);   color: var(--wrong);   background: var(--wrong-bg); }

/* feedback */
.qc-fb {
  font-size: 11px; font-weight: 900; text-align: center; line-height: 1.35;
  animation: fbup .2s ease;
}
@keyframes fbup { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
.qc-fb.fb-ok  { color: var(--correct); }
.qc-fb.fb-err { color: var(--wrong); }
.qc-fb.fb-ans { color: var(--wrong); font-size: 10px; }

/* ══ TIMESUP BANNER ══ */
.timesup-banner {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: linear-gradient(135deg, #f44336, #ff7043);
  color: #fff; text-align: center; padding: 13px;
  font-size: 17px; font-weight: 900;
  box-shadow: 0 4px 20px rgba(244,67,54,.5);
  animation: slideDown .4s cubic-bezier(.36,.07,.19,.97);
}
@keyframes slideDown { from{transform:translateY(-100%)} to{transform:translateY(0)} }
.timesup-banner.show { display: block; }

/* ══ RESULT ══ */
#resultScreen {
  justify-content: center; gap: 16px; padding: 28px 20px;
  background: linear-gradient(160deg, #fff8f0, #ffeee6);
}
.r-card {
  background: var(--card); border-radius: 22px; padding: 26px 30px;
  box-shadow: var(--shadow); display: flex; flex-direction: column;
  align-items: center; gap: 7px; width: 100%; max-width: 340px; text-align: center;
}
.r-emoji  { font-size: 66px; animation: rpop .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes rpop { 0%{transform:scale(0)rotate(-15deg)} 80%{transform:scale(1.1)rotate(2deg)} 100%{transform:scale(1)} }
.r-grade  { font-size: 60px; font-weight: 900; font-family: 'Nunito', sans-serif; line-height: 1; }
.r-grade.S{color:#00c896} .r-grade.A{color:#f9a825} .r-grade.B{color:#ff6b35} .r-grade.C{color:#f44336}
.r-score  { font-size: 21px; font-weight: 900; }
.r-pct    { font-size: 14px; color: var(--muted); font-weight: 700; }
.r-date   { font-size: 12px; color: var(--muted); }

.stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; }
.sb { background: var(--card); border-radius: 13px; padding: 13px 6px; box-shadow: var(--shadow); text-align: center; }
.sb .sv { font-size: 26px; font-weight: 900; font-family: 'Nunito', sans-serif; }
.sb .sk { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 3px; }
.sb-ok .sv{color:var(--correct)} .sb-err .sv{color:var(--wrong)} .sb-sk .sv{color:var(--blue)}

.r-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 340px; }
.btn-retry {
  background: linear-gradient(135deg, var(--primary), #ff9a5c);
  color: #fff; border: none; border-radius: 50px;
  padding: 14px 0; font-size: 16px; font-weight: 900; cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,107,53,.4);
  transition: transform .15s; font-family: 'Noto Sans TC', sans-serif; flex: 1;
}
.btn-retry:hover { transform: translateY(-2px); }
.btn-sec {
  background: var(--card); border: 2px solid #eee; border-radius: 50px;
  padding: 12px 0; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: border-color .15s, color .15s;
  font-family: 'Noto Sans TC', sans-serif; flex: 1; white-space: nowrap;
}
.btn-sec:hover { border-color: var(--primary); color: var(--primary); }
.btn-sec.err-btn:hover { border-color: var(--wrong); color: var(--wrong); }
.err-badge {
  display: inline-block; background: var(--wrong); color: #fff;
  border-radius: 50%; width: 17px; height: 17px; font-size: 10px;
  text-align: center; line-height: 17px; font-family: 'Nunito', sans-serif;
  font-weight: 900; margin-left: 3px; vertical-align: middle;
}

/* ══ MODALS ══ */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 300;
  align-items: center; justify-content: center; padding: 16px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg); border-radius: 22px; padding: 22px;
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-hd h2 { font-size: 18px; font-weight: 900; }
.btn-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }

/* wrong book */
.wlist { display: flex; flex-direction: column; gap: 9px; }
.witem {
  background: var(--card); border-radius: 13px; padding: 13px 15px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
  border-left: 4px solid var(--wrong);
}
.wi-expr { font-size: 19px; font-weight: 900; font-family: 'Nunito', sans-serif; min-width: 80px; }
.wi-detail { display: flex; flex-direction: column; gap: 3px; }
.wi-u { font-size: 13px; color: var(--wrong); font-weight: 700; }
.wi-u span, .wi-c span { font-family: 'Nunito', sans-serif; font-size: 15px; }
.wi-c { font-size: 13px; color: var(--correct); font-weight: 700; }

/* history */
.hlist { display: flex; flex-direction: column; gap: 9px; }
.hitem {
  background: var(--card); border-radius: 13px; padding: 13px 16px;
  display: grid; grid-template-columns: 1fr auto;
  gap: 3px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.05);
}
.hi-date   { font-size: 13px; color: var(--muted); font-weight: 700; }
.hi-detail { font-size: 12px; color: var(--muted); }
.hi-score  { font-size: 24px; font-weight: 900; font-family: 'Nunito', sans-serif; text-align: center; }
.hi-grade  { text-align: center; }
.btn-clear {
  background: none; border: 2px solid #eee; border-radius: 50px;
  padding: 9px 22px; font-size: 13px; font-weight: 700; color: var(--muted);
  cursor: pointer; margin-top: 12px; display: block;
  transition: border-color .15s, color .15s;
  font-family: 'Noto Sans TC', sans-serif;
}
.btn-clear:hover { border-color: var(--wrong); color: var(--wrong); }

/* confetti */
.cf { position: fixed; top: -20px; border-radius: 3px; animation: cfFall linear forwards; pointer-events: none; z-index: 999; }
@keyframes cfFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>

<div class="timesup-banner" id="timesupBanner">⏰ 時間到！剩餘未作答題目已鎖定</div>

<!-- ══ START ══ -->
<div id="startScreen" class="screen active">
  <div class="logo-icon">✖️</div>
  <div class="app-title">九九乘法大挑戰</div>
  <div class="app-sub">100 題・自填答案・5 分鐘計時</div>
  <div class="badges">
    <div class="badge">📋 <b>100</b> 道題目</div>
    <div class="badge">⏱ <b>5:00</b> 計時</div>
    <div class="badge">✏️ 自填答案</div>
  </div>
  <button class="btn-start" onclick="startQuiz()">🚀 開始測驗</button>
  <div class="hist-box">
    <div class="hist-box-title">📊 最近紀錄</div>
    <div id="startHistList"><div class="no-rec">尚無紀錄，快來挑戰！</div></div>
  </div>
</div>

<!-- ══ QUIZ ══ -->
<div id="quizScreen" class="screen">
  <div class="topbar">
    <div class="prog-wrap">
      <div class="prog-labels">
        <span id="progLabel">0 / 100</span>
        <span id="answeredLabel">已答 0 題</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="topbar-ok">
      <span class="tv" id="liveOk">0</span>
      <span class="tl">答對</span>
    </div>
    <div class="timer" id="timerEl">5:00</div>
  </div>
  <div class="q-grid" id="qGrid"></div>
</div>

<!-- ══ RESULT ══ -->
<div id="resultScreen" class="screen">
  <div class="r-card">
    <div class="r-emoji" id="rEmoji">🎉</div>
    <div class="r-grade" id="rGrade">S</div>
    <div class="r-score" id="rScore">答對 95 題</div>
    <div class="r-pct"   id="rPct">正確率 95%・用時 4分20秒</div>
    <div class="r-date"  id="rDate"></div>
  </div>
  <div class="stat-row">
    <div class="sb sb-ok">  <div class="sv" id="svOk">0</div>  <div class="sk">✅ 答對</div></div>
    <div class="sb sb-err"> <div class="sv" id="svErr">0</div> <div class="sk">❌ 答錯</div></div>
    <div class="sb sb-sk">  <div class="sv" id="svSk">0</div>  <div class="sk">⏭ 未答</div></div>
  </div>
  <div class="r-btns">
    <button class="btn-retry" onclick="startQuiz()">🔄 再來一次</button>
  </div>
  <div class="r-btns">
    <button class="btn-sec err-btn" onclick="openWrongBook()">📒 錯題本 <span class="err-badge" id="errBadge">0</span></button>
    <button class="btn-sec" onclick="openHistory()">📋 歷史紀錄</button>
  </div>
</div>

<!-- ══ WRONG BOOK MODAL ══ -->
<div class="overlay" id="wrongOverlay">
  <div class="modal">
    <div class="modal-hd">
      <h2>📒 本次錯題本</h2>
      <button class="btn-close" onclick="closeOverlay('wrongOverlay')">✕</button>
    </div>
    <div class="wlist" id="wrongList"></div>
  </div>
</div>

<!-- ══ HISTORY MODAL ══ -->
<div class="overlay" id="histOverlay">
  <div class="modal">
    <div class="modal-hd">
      <h2>📋 所有紀錄</h2>
      <button class="btn-close" onclick="closeOverlay('histOverlay')">✕</button>
    </div>
    <div class="hlist" id="histList"></div>
    <button class="btn-clear" onclick="clearHistory()">🗑 清除全部紀錄</button>
  </div>
</div>

<script>
/* ── CONFIG ── */
const TOTAL    = 100;
const DURATION = 300;
const HIST_KEY = 'multiTest_v3';

/* ── STATE ── */
let questions     = [];
let timeLeft      = DURATION;
let timerInt      = null;
let answeredCount = 0;
let correctCount  = 0;
let wrongItems    = [];

/* ── GENERATE ── */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function genQuestions() {
  const base = [];
  for (let a = 1; a <= 9; a++) for (let b = 1; b <= 9; b++) base.push({ a, b, ans: a * b });
  return Array.from({ length: TOTAL }, () => {
    const q = base[Math.floor(Math.random() * base.length)];
    return { a: q.a, b: q.b, ans: q.ans, answered: false, locked: false, userAns: null };
  });
}

/* ── RENDER GRID ── */
function renderGrid() {
  const grid = document.getElementById('qGrid');
  grid.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'qc';
    card.id = 'qc-' + i;
    card.innerHTML = `
      <div class="qc-num">#${i + 1}</div>
      <div class="qc-expr">${q.a} × ${q.b} =</div>
      <input class="qc-inp" id="inp-${i}" type="number" inputmode="numeric"
        min="1" max="81" autocomplete="off" placeholder="?"
        onkeydown="handleKey(event,${i})"
        onfocus="currentFocus=${i}">
      <div class="qc-fb" id="fb-${i}" style="display:none"></div>
    `;
    grid.appendChild(card);
  });
  updateTopbar();
}

/* ── INPUT HANDLING ── */
let currentFocus = 0;

function handleKey(e, i) {
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    commitAnswer(i);
  }
}

function commitAnswer(i) {
  const q   = questions[i];
  if (q.answered || q.locked) return;

  const inp = document.getElementById('inp-' + i);
  const raw = inp.value.trim();
  if (raw === '') return; // don't lock blank

  const val = parseInt(raw, 10);
  if (isNaN(val)) return;

  q.answered = true;
  q.userAns  = val;
  answeredCount++;

  const card = document.getElementById('qc-' + i);
  const fb   = document.getElementById('fb-' + i);
  inp.readOnly = true;

  if (val === q.ans) {
    correctCount++;
    card.classList.add('state-correct');
    inp.classList.add('inp-correct');
    fb.textContent  = '✅ 答對了！';
    fb.className    = 'qc-fb fb-ok';
    fb.style.display = '';
  } else {
    wrongItems.push({ a: q.a, b: q.b, ans: q.ans, userAns: val });
    card.classList.add('state-wrong');
    inp.classList.add('inp-wrong');
    fb.innerHTML    = `❌ 答錯了！<br>正解是 <b>${q.ans}</b>`;
    fb.className    = 'qc-fb fb-err';
    fb.style.display = '';
  }

  updateTopbar();
  if (answeredCount >= TOTAL) endQuiz(false);
  else moveNext(i);
}

function moveNext(from) {
  for (let k = 1; k <= TOTAL; k++) {
    const next = (from + k) % TOTAL;
    if (!questions[next].answered && !questions[next].locked) {
      const inp = document.getElementById('inp-' + next);
      currentFocus = next;
      inp.focus();
      inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
  }
}

function updateTopbar() {
  document.getElementById('progLabel').textContent    = `${answeredCount} / ${TOTAL}`;
  document.getElementById('answeredLabel').textContent = `已答 ${answeredCount} 題`;
  document.getElementById('progFill').style.width      = (answeredCount / TOTAL * 100) + '%';
  document.getElementById('liveOk').textContent        = correctCount;
}

/* ── TIMER ── */
function startTimer() {
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) { timeLeft = 0; renderTimer(); endQuiz(true); }
  }, 1000);
  renderTimer();
}

function renderTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('timerEl');
  el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  el.className = 'timer' + (timeLeft <= 30 ? ' danger' : timeLeft <= 60 ? ' warn' : '');
}

/* ── START / END ── */
function startQuiz() {
  questions     = genQuestions();
  timeLeft      = DURATION;
  answeredCount = 0;
  correctCount  = 0;
  wrongItems    = [];
  currentFocus  = 0;

  document.getElementById('timesupBanner').classList.remove('show');
  showScreen('quizScreen');
  renderGrid();
  startTimer();

  // focus first input
  setTimeout(() => { document.getElementById('inp-0').focus(); }, 120);
}

function endQuiz(timesUp) {
  clearInterval(timerInt);

  if (timesUp) {
    document.getElementById('timesupBanner').classList.add('show');
    // Lock all unanswered
    questions.forEach((q, i) => {
      if (!q.answered) {
        q.locked = true;
        const inp = document.getElementById('inp-' + i);
        if (inp) { inp.readOnly = true; inp.placeholder = '—'; }
        document.getElementById('qc-' + i).classList.add('state-locked');
      }
    });
    setTimeout(showResult, 1600);
  } else {
    showResult();
  }
}

function showResult() {
  const skipped = TOTAL - answeredCount;
  const wrong   = answeredCount - correctCount;
  const pct     = Math.round(correctCount / TOTAL * 100);
  const used    = DURATION - timeLeft;
  const um = Math.floor(used / 60), us = used % 60;
  const { grade, emoji } = getGrade(pct);
  const now = new Date();

  saveHistory({ date: now.toISOString(), correct: correctCount, wrong, skipped, pct, time: used });

  document.getElementById('rEmoji').textContent  = emoji;
  const ge = document.getElementById('rGrade');
  ge.textContent = grade; ge.className = 'r-grade ' + grade;
  document.getElementById('rScore').textContent  = `答對 ${correctCount} 題`;
  document.getElementById('rPct').textContent    = `正確率 ${pct}%・用時 ${um}分${us.toString().padStart(2,'0')}秒`;
  document.getElementById('rDate').textContent   = formatDate(now) + ' 的成績';
  document.getElementById('svOk').textContent    = correctCount;
  document.getElementById('svErr').textContent   = wrong;
  document.getElementById('svSk').textContent    = skipped;
  document.getElementById('errBadge').textContent = wrongItems.length;

  loadStartHistory();
  showScreen('resultScreen');
  if (pct >= 90) launchConfetti();
}

function getGrade(p) {
  if (p >= 95) return { grade: 'S', emoji: '🏆' };
  if (p >= 85) return { grade: 'A', emoji: '🌟' };
  if (p >= 70) return { grade: 'B', emoji: '😊' };
  return           { grade: 'C', emoji: '💪' };
}

/* ── WRONG BOOK ── */
function openWrongBook() {
  const el = document.getElementById('wrongList');
  if (!wrongItems.length) {
    el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;font-size:14px">🎉 本次沒有錯題！太厲害了！</div>';
  } else {
    el.innerHTML = wrongItems.map(w => `
      <div class="witem">
        <div class="wi-expr">${w.a} × ${w.b}</div>
        <div class="wi-detail">
          <div class="wi-u">❌ 你答：<span>${w.userAns}</span></div>
          <div class="wi-c">✅ 正解：<span>${w.ans}</span></div>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('wrongOverlay').classList.add('open');
}

/* ── HISTORY ── */
function openHistory() {
  const arr = loadHistory();
  const el  = document.getElementById('histList');
  const gc  = { S:'#00c896', A:'#f9a825', B:'#ff6b35', C:'#f44336' };
  const gb  = { S:'#e6fff8', A:'#fff8e1', B:'#fff0eb', C:'#fff0ef' };
  if (!arr.length) {
    el.innerHTML = '<div style="color:var(--muted);padding:16px;font-size:14px">尚無紀錄</div>';
  } else {
    el.innerHTML = arr.map((r, i) => {
      const { grade } = getGrade(r.pct);
      const m = Math.floor(r.time / 60), s = r.time % 60;
      return `<div class="hitem">
        <div>
          <div class="hi-date">第 ${arr.length - i} 次・${formatDate(new Date(r.date))}</div>
          <div class="hi-detail">✅${r.correct} ❌${r.wrong} ⏭${r.skipped}・⏱${m}分${s.toString().padStart(2,'0')}秒</div>
        </div>
        <div>
          <div class="hi-score" style="color:${gc[grade]}">${r.correct}</div>
          <div class="hi-grade"><span class="gpill g${grade}" style="background:${gb[grade]};color:${gc[grade]}">${grade}級 ${r.pct}%</span></div>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('histOverlay').classList.add('open');
}

function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

function clearHistory() {
  if (!confirm('確定清除全部歷史紀錄嗎？')) return;
  localStorage.removeItem(HIST_KEY);
  closeOverlay('histOverlay');
  loadStartHistory();
}

/* ── STORAGE ── */
function saveHistory(r) {
  const a = loadHistory();
  a.unshift(r);
  if (a.length > 60) a.length = 60;
  localStorage.setItem(HIST_KEY, JSON.stringify(a));
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function loadStartHistory() {
  const arr = loadHistory().slice(0, 5);
  const el  = document.getElementById('startHistList');
  if (!arr.length) { el.innerHTML = '<div class="no-rec">尚無紀錄，快來挑戰！</div>'; return; }
  el.innerHTML = '<div class="hist-mini-rows">' + arr.map(r => {
    const { grade } = getGrade(r.pct);
    return `<div class="hmr">
      <span class="hmr-date">${formatDate(new Date(r.date))}</span>
      <span class="gpill g${grade}">${r.correct}題・${r.pct}%</span>
    </div>`;
  }).join('') + '</div>';
}

/* ── UTILS ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function formatDate(d) {
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function launchConfetti() {
  const cols = ['#ff6b35','#ffca28','#00c896','#2196f3','#9c27b0','#f44336'];
  for (let i = 0; i < 90; i++) {
    const el = document.createElement('div');
    el.className = 'cf';
    const sz = 7 + Math.random() * 10;
    Object.assign(el.style, {
      width: sz+'px', height: sz+'px',
      left: Math.random() * 100 + 'vw',
      background: cols[Math.floor(Math.random() * cols.length)],
      animationDuration: (1.4 + Math.random() * 1.8) + 's',
      animationDelay: Math.random() * .8 + 's',
      transform: `rotate(${Math.random()*360}deg)`
    });
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ── INIT ── */
loadStartHistory();
</script>
</body>
